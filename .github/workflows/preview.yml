name: Publish develop preview

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build preview at /preview/
        run: npm run build
        env:
          ASTRO_PREVIEW: 'true'
      - name: Validate preview URLs
        run: node scripts/check-preview.mjs
      - name: Assemble Pages artifact
        run: |
          mkdir -p publish/preview
          cp -a dist/. publish/preview/
          cat > publish/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta name="robots" content="noindex, nofollow">
              <title>Jaanek Kerma — Portfolio in development</title>
              <style>
                body{font:16px system-ui,sans-serif;background:#101318;color:#f3f4f0;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}
                main{max-width:640px}
                h1{font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.04em}
                p{line-height:1.75;color:#bbc4c9}
                a{color:#b9ec91}
              </style>
            </head>
            <body><main><h1>Jaanek Kerma</h1><p>My new portfolio is being designed and reviewed. The development version is available as a separate preview; the existing Wix portfolio remains the current published version.</p><p><a href="/preview/">Explore the development preview →</a> · <a href="https://jaanekkerma.wixsite.com/portfolio">Current portfolio →</a></p></main></body>
          </html>
          HTML
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: portfolio-preview
      url: https://jaanekkerma.github.io/preview/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
